[project]
name = "visionx"
version = "0.1.0"
description = "VisionX: asistencia espacial por voz con cámara estéreo y fusión de profundidad (TPF I308, UdeSA)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",  # contrib: aruco/ChArUco y ximgproc (filtro WLS)
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Redes: Depth Anything V2, U-Net de Fusion. En la Mac corre con MPS.
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.scripts]
visionx = "visionx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visionx"]

# Empaquetar el mismo default del checkout, sin mantener una segunda copia manual.
[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "visionx/default.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"
