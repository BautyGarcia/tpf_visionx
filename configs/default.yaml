# Configuración por defecto de VisionX. Los valores se cambian acá, no en el código.

artifacts:
  root: null                # carpeta local de VisionX-artefactos (Drive); cada uno la pisa en configs/local.yaml

camera:
  device: 0                 # índice de la ELP en OpenCV (cada uno lo pisa en configs/local.yaml)
  backend: auto             # auto | avfoundation (macOS) | dshow | msmf (Windows) | v4l2 (Linux)
  capture: [3840, 1080]     # par lado a lado, MJPEG
  fourcc: MJPG
  fps: 30                   # pedido al driver; la ELP entrega ~60 y CAP_PROP_FPS informa 5: medir
  swap_eyes: false          # true solo si `python -m visionx.camera ver` muestra los ojos invertidos
  reconnect_attempts: 3     # reaperturas antes de declarar la cámara perdida (SourceError)
  warmup_frames: 5          # cuadros descartados al abrir
  calibration: configs/calib/elp-2026-11-11-corregida.yaml  # s6 + corrección de disparidad, BITACORA 2026-11-13

depth:
  compute: [1280, 720]      # resolución por ojo para profundidad
  range_m: [0.5, 3.0]       # rango donde se anuncian metros
  sgbm:
    num_disparities: 96     # mínimo ~0,25 m a 720p
    block_size: 5

calibration:
  board: charuco
  squares: [11, 8]
  square_m: 0.030           # reemplazar por la medida real con regla
  marker_m: 0.022
  dictionary: DICT_5X5_100

audio:
  speech_rate: 1.0
