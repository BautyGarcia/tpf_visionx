descarga_manual: 'Los links de OneDrive del README (https://github.com/YuhuaXu/StereoDataset) no se pueden
  bajar por script. Bajar a mano los zip (partN.zip y test.zip), dejarlos en data/descargas/instereo2k/
  y correr `descargar instereo2k`: controla el hash y los extrae.'
reglas_gt:
- disparidad en px = PNG uint16 / 100; 0 = sin GT (NaN en StereoSample)
- 'sin calibración publicada: sin metros'
notas:
- Escena = tramo de 100 cuadros consecutivos (los cuadros vecinos son el mismo armado); el dataset no
  publica escenas.
- 'El test oficial (cuadros 000040, 000080, ...) comparte tramos con train: no es independiente y no se
  usa como test.'
- 'Subconjunto disponible: part2-4 y test, 1221 de 2050 pares. part1, part5 y part6 no se pueden bajar
  de OneDrive (13/11/2026).'
- 'Comparadores FoundationStereo/FFS entrenaron con InStereo2K: no es test.'
