nombre: middeval3
rol: test público principal
fuente: https://vision.middlebury.edu/stereo/submit3/
licencia: Sin licencia declarada en la página; uso académico citando el paper
cita: Scharstein et al., High-resolution stereo datasets with subpixel-accurate ground truth, GCPR 2014
descargas:
- url: https://vision.middlebury.edu/stereo/submit3/zip/MiddEval3-data-H.zip
  bytes: 109900544
  sha256: 2fc24f494a1e62066d0519cf86b759f344fc7bf0f49785632b582763fb0770a8
- url: https://vision.middlebury.edu/stereo/submit3/zip/MiddEval3-GT0-H.zip
  bytes: 53097428
  sha256: c6537f6ee9debcf2a2ec605e69950b5feecb3c5df369f313bb22761acf74025c
descarga_manual: null
reglas_gt:
- disparidad en px, d = x_izq - x_der; infinito del PFM = sin GT (NaN en StereoSample)
- 'máscara: 0 sin GT, 128 ocluido, 255 visible en ambos; métricas noc usan 255'
- 'metros: Z = fx * baseline / (d + doffs), baseline de calib.txt en mm -> m'
notas:
- Solo trainingH tiene GT; testH no se usa.
- 'Comparadores: no usar pesos entrenados con Middlebury (TECNICO T14).'
particion:
  test:
  - Adirondack
  - Art
  - Jadeplant
  - Motorcycle
  - Piano
  - Pipes
  - Playroom
  - Playtable
  - Recycle
  - Shelves
  - Teddy
  - Vintage
